services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    command: sh -c "python manage.py collectstatic --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - UNIFI_USER=${UNIFI_USER:-portal_admin}
      - UNIFI_PASSWORD=${UNIFI_PASSWORD:-}
      - UNIFI_API_KEY=${UNIFI_API_KEY:-}
      - UNIFI_DURATION_MINUTES=${UNIFI_DURATION_MINUTES:-1440}
      - UNIFI_HOST=${UNIFI_HOST:-https://host.docker.internal:8443}

  frontend:
    build: ./frontend
    restart: unless-stopped
    command: sh -c "npm run build && npm run preview -- --host --port 5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    ports:
      - "5173:5173"

volumes:
  postgres_data: